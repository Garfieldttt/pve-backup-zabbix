zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: 173b3af4d31543a19b0379f2d489d527
      template: 'Template Proxmox VE Backup'
      name: 'Template Proxmox VE Backup'
      description: |
        Author: Thomas Rzen
        
        For more information, visit https://github.com/Garfieldttt/pve-backup-zabbix/tree/zabbix
      groups:
        - name: Templates
      items:
        - uuid: bc3d769e3559463ea5e18b3000addb15
          name: raw.data.pve_backup
          type: ZABBIX_ACTIVE
          key: 'vfs.file.contents[{$BACKUP_LOCATION}]'
          history: 1d
          value_type: TEXT
          trends: '0'
      discovery_rules:
        - uuid: 895a1aa8cc824877b5373281f86f9aba
          name: pve-backup
          type: DEPENDENT
          key: pve-backup.stat
          delay: '0'
          item_prototypes:
            - uuid: 319bb0450d6e43838c726a82d764c71f
              name: 'Backup end-time {#VMID} {#NAME}'
              type: DEPENDENT
              key: 'backup.endtime[{#VMID}]'
              delay: '0'
              units: unixtime
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.backups[?(@.vmid == "{#VMID}")].end'
                - type: LTRIM
                  parameters:
                    - '["'
                - type: RTRIM
                  parameters:
                    - '"]'
              master_item:
                key: 'vfs.file.contents[{$BACKUP_LOCATION}]'
              tags:
                - tag: pve-backup
                  value: end-time
              trigger_prototypes:
                - uuid: 204da82367114c24a98bfc1cf5d2d40d
                  expression: 'max(/Template Proxmox VE Backup/backup.endtime[{#VMID}],{$BACKUP_TIME})<= last(/Template Proxmox VE Backup/backup.endtime[{#VMID}])'
                  name: 'No backup in {$BACKUP_TIME} (VMID: {#VMID})'
                  priority: HIGH
                  manual_close: 'YES'
            - uuid: c023e0ec96c94720a38617b463763966
              name: 'Backup size (last) - VM {#VMID} ({#NAME})'
              type: DEPENDENT
              key: 'backup.size[{#VMID}]'
              delay: '0'
              value_type: FLOAT
              units: byte
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.backups[?(@.vmid == "{#VMID}")].size_bytes'
                - type: LTRIM
                  parameters:
                    - '["'
                - type: RTRIM
                  parameters:
                    - '"]'
              master_item:
                key: 'vfs.file.contents[{$BACKUP_LOCATION}]'
              tags:
                - tag: pve-backup
                  value: size
            - uuid: 30520dd8833c4b8c81d4b6e3dc69e673
              name: 'Backup start-time {#VMID} {#NAME}'
              type: DEPENDENT
              key: 'backup.starttime[{#VMID}]'
              delay: '0'
              units: unixtime
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.backups[?(@.vmid == "{#VMID}")].start'
                - type: LTRIM
                  parameters:
                    - '["'
                - type: RTRIM
                  parameters:
                    - '"]'
              master_item:
                key: 'vfs.file.contents[{$BACKUP_LOCATION}]'
              tags:
                - tag: pve-backup
                  value: start-time
            - uuid: 9146e966a985489ca0498fcb0723c3b6
              name: 'Backup status {#VMID} {#NAME}'
              type: DEPENDENT
              key: 'backup.status[{#VMID}]'
              delay: '0'
              value_type: FLOAT
              description: |
                Backup status of the VM based on vzdump log.
                0 = Failure, 1 = Success
              valuemap:
                name: BACKUP-STATUS
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.backups[?(@.vmid == "{#VMID}")].status'
                - type: LTRIM
                  parameters:
                    - '["'
                - type: RTRIM
                  parameters:
                    - '"]'
                - type: STR_REPLACE
                  parameters:
                    - OK
                    - '1'
                - type: STR_REPLACE
                  parameters:
                    - FAILED
                    - '0'
                - type: STR_REPLACE
                  parameters:
                    - running
                    - '2'
              master_item:
                key: 'vfs.file.contents[{$BACKUP_LOCATION}]'
              tags:
                - tag: pve-backup
                  value: status
              trigger_prototypes:
                - uuid: c39a40fb015a46cbbf62252418249283
                  expression: 'last(/Template Proxmox VE Backup/backup.status[{#VMID}])=0'
                  name: 'Backup failed on(VMID: {#VMID}'
                  opdata: '{HOST.NAME}: {#NAME} (VMID: {#VMID})'
                  priority: HIGH
          master_item:
            key: 'vfs.file.contents[{$BACKUP_LOCATION}]'
          lld_macro_paths:
            - lld_macro: '{#END.TIME}'
              path: $.end
            - lld_macro: '{#NAME}'
              path: $.name
            - lld_macro: '{#START.TIME}'
              path: $.start
            - lld_macro: '{#VMID}'
              path: $.vmid
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.backups[*]'
      macros:
        - macro: '{$BACKUP_LOCATION}'
          value: /var/log/backups.log
        - macro: '{$BACKUP_TIME}'
          value: 48h
          description: 'The time period Zabbix waits before triggering if no backup has been made. Possible values: s = seconds, m = minutes, h = hours, d = days.'
      valuemaps:
        - uuid: 446a711ec6424c7ea2ff76f6a64b0707
          name: BACKUP-STATUS
          mappings:
            - value: '1'
              newvalue: OK
            - value: '0'
              newvalue: ERROR
            - value: '2'
              newvalue: RUNNING
